<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hunter Jobs — Synthetic Demo</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#0d1420;--line:#223047;--text:#e4edf8;--muted:#8ea0b7;--green:#00f0a0;--amber:#ffb454;--cyan:#4bc7f5;--red:#ff667c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 5%,#0b2b29,transparent 30%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0}.header,.card{border:1px solid var(--line);background:rgba(13,20,32,.94);border-radius:18px}.header{padding:24px;margin-bottom:18px}.header h1{margin:0 0 8px;font-size:30px}.header h1 span{color:var(--green)}.header p{margin:0;color:var(--muted)}.notice{margin-top:16px;padding:10px 12px;border:1px solid #2e6c5a;border-radius:10px;color:var(--green);font-family:monospace}.filters{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}button{border:1px solid var(--line);background:#101927;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}button.active{border-color:var(--green);color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.card{padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.tier{font:800 13px monospace;padding:7px 9px;border-radius:9px;border:1px solid currentColor}.A{color:var(--green)}.B{color:var(--amber)}.C{color:var(--cyan)}.Rejected{color:var(--red)}h2{font-size:18px;margin:0 0 5px}.company,.description{color:var(--muted)}.score{font:800 28px monospace;margin:16px 0 8px}.skills,.reasons{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:5px 7px;border-radius:999px;font-size:12px}.reasons{margin-top:12px}.reason{color:var(--muted);font-size:12px}a{color:var(--cyan)}@media(max-width:600px){.shell{width:min(100% - 18px,1180px);padding-top:18px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><section class="header"><h1><span>Hunter Jobs</span> — edição sanitizada</h1><p>Descoberta, scoring e revisão humana de oportunidades.</p><div class="notice">Todos os registros exibidos são sintéticos e usam empresas fictícias.</div></section><div class="filters" id="filters"></div><section class="grid" id="grid"></section></main>
<script>
let rows=[];let selected='All';
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const tiers=['All','A','B','C','Rejected'];document.querySelector('#filters').innerHTML=tiers.map(t=>`<button class="${selected===t?'active':''}" data-tier="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{selected=b.dataset.tier;render()});const visible=selected==='All'?rows:rows.filter(r=>r.tier===selected);document.querySelector('#grid').innerHTML=visible.map(r=>`<article class="card"><div class="top"><div><h2>${esc(r.title)}</h2><div class="company">${esc(r.company)}</div></div><span class="tier ${esc(r.tier)}">${esc(r.tier)}</span></div><div class="score">${esc(r.score)}/100</div><p class="description">${esc(r.description)}</p><div class="skills">${r.matchedSkills.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div><div class="reasons">${r.reasons.map(x=>`<span class="reason">• ${esc(x)}</span>`).join('')}</div><p><a href="${esc(r.url)}" rel="noreferrer">URL sintética</a></p></article>`).join('')||'<p>Nenhum registro.</p>'}
fetch('/api/opportunities').then(r=>r.json()).then(data=>{rows=data;render()}).catch(()=>{document.querySelector('#grid').textContent='Falha ao carregar a demonstração.'});
</script></body></html>
